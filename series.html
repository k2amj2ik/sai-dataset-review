<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAI 시리즈 데이터셋 검토</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;background:#f1f5f9}
#lock{max-width:360px;margin:15vh auto;background:#fff;padding:28px 26px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.12);text-align:center}
#lock h2{font-size:17px;color:#1a3a5c;margin:0 0 6px}
#lock p{font-size:13px;color:#64748b;margin:0 0 18px;line-height:1.5}
#lock input{width:100%;padding:11px;font-size:14px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}
#lock button{width:100%;margin-top:10px;padding:11px;font-size:14px;font-weight:700;background:#1a3a5c;color:#fff;border:0;border-radius:8px;cursor:pointer}
#err{color:#dc2626;font-size:12px;margin-top:8px;min-height:14px}
#app{display:none}
.cmt-act{margin-left:8px;font-size:11px;white-space:nowrap}
.cmt-act button{background:none;border:0;color:#6366f1;cursor:pointer;font-size:11px;padding:0 3px}
.cmt-act button:hover{text-decoration:underline}
.cmt-edit{width:100%;box-sizing:border-box;font-size:12.5px;padding:6px 8px;border:1px solid #6366f1;border-radius:6px;font-family:inherit;margin:4px 0;min-height:40px}
.cmt-esave,.cmt-ecancel{font-size:12px;border:0;border-radius:5px;padding:5px 11px;cursor:pointer;margin-right:5px}
.cmt-esave{background:#1a3a5c;color:#fff}
.cmt-ecancel{background:#e5e7eb;color:#374151}
.asgwrap{margin-top:6px}
.asg{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.asg .pill{font-size:11px;background:#0f766e;color:#fff;border-radius:10px;padding:2px 9px;font-weight:600}
.asg .pill.cur{background:#fff;color:#475569;border:1px solid #cbd5e1}
.asg .none{font-size:11px;color:#b0b8c4}
.asg-btn{font-size:11px;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:5px;padding:4px 9px;cursor:pointer;font-weight:600;margin-right:5px}
.pk-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:2000;align-items:center;justify-content:center;padding:18px}
.pk-overlay.on{display:flex}
.pk-modal{background:#fff;max-width:460px;width:100%;height:90vh;display:flex;flex-direction:column;border-radius:14px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pk-head{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:#1a3a5c;margin-bottom:4px;font-weight:700}
.pk-x{cursor:pointer;font-size:24px;color:#94a3b8;line-height:1}
.pk-sub{font-size:11.5px;color:#64748b;margin-bottom:8px}
#pk-search{padding:9px 11px;font-size:13px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:8px}
.pk-list{overflow-y:auto;flex:1;border:1px solid #eef2f7;border-radius:8px;padding:4px;min-height:120px}
.pk-list label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;border-radius:6px;cursor:pointer}
.pk-list label:hover{background:#f1f5f9}
.pk-list label.hid{display:none}
.pk-foot{display:flex;gap:8px;margin-top:10px}
.pk-foot button{flex:1;padding:9px;font-size:13px;font-weight:700;border:0;border-radius:8px;cursor:pointer}
#pk-save{background:#1a3a5c;color:#fff}
#pk-cancel{background:#e5e7eb;color:#374151}
.load-overlay{position:fixed;inset:0;background:rgba(248,250,252,.95);z-index:3000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.load-overlay.on{display:flex}
.spinner{width:46px;height:46px;border:4px solid #dbe2ea;border-top-color:#1a3a5c;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:14px;color:#1a3a5c;font-weight:700}
.load-sub{font-size:12px;color:#94a3b8;margin-top:-8px}
</style></head><body>
<div id="lock"><form id="lockform"><h2>SAI 시리즈 데이터셋 검토</h2><p>검토위원 전용 페이지입니다.<br>공유받은 비밀번호를 입력하세요.</p>
<input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
<button id="go" type="submit">열기</button><div id="err"></div></form></div>
<div id="app"></div>
<div id="loader" class="load-overlay"><div class="spinner"></div><div class="load-txt">데이터를 불러오는 중입니다…</div><div class="load-sub">작가 목록과 검토 내용을 준비하고 있어요</div></div>
<div id="pk" class="pk-overlay"><div class="pk-modal">
<div class="pk-head"><span id="pk-title">화풍 지정</span><span class="pk-x" id="pk-x">&times;</span></div>
<div class="pk-sub">해당 작가에 맞는 화풍을 선택하세요. 여러 개 선택 가능합니다.</div>
<input id="pk-search" placeholder="화풍 검색…">
<div id="pk-list" class="pk-list"></div>
<div class="pk-foot"><button id="pk-save" type="button">저장</button><button id="pk-cancel" type="button">취소</button></div>
</div></div>

const B=JSON.parse(document.getElementById('blob').textContent);
function b2b(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function unlock(pw){const enc=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b2b(B.salt),iterations:B.iter,hash:'SHA-256'},km,256);
 const key=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2b(B.iv),tagLength:128},key,b2b(B.ct));
 return JSON.parse(new TextDecoder().decode(pt));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function nameNow(){return (localStorage.getItem('sai_rev_name')||'').trim();}
function listHtml(list){if(!list||!list.length)return '<div class="cmt-empty">아직 코멘트가 없습니다.</div>';
 var me=nameNow();
 return list.map(function(c){var mine=(me&&c.reviewer===me);
  var acts=mine?'<span class="cmt-act"><button type="button" data-act="edit" data-id="'+c.id+'">수정</button><button type="button" data-act="del" data-id="'+c.id+'">삭제</button></span>':'';
  return '<div class="cmt-c" data-id="'+c.id+'"><span class="who">'+esc(c.reviewer)+'</span><span class="when">'+esc(c.created_at)+'</span>'+acts+'<div class="bd">'+esc(c.body)+'</div></div>';}).join('');}
function formHtml(){return '<div class="cmt-form"><textarea placeholder="검토 의견을 입력하세요"></textarea><button type="button">등록</button></div>';}
function bindForm(box,key,label){const ta=box.querySelector('textarea'),btn=box.querySelector('.cmt-form button');
 btn.addEventListener('click',async()=>{const name=nameNow();
  if(!name){alert('상단에 검토위원 이름을 먼저 입력하세요.');return;}
  const body=ta.value.trim();if(!body)return;btn.disabled=true;btn.textContent='등록중';
  try{const r=await fetch(API+'/c',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataset:DS,item_key:key,item_label:label,reviewer:name,body:body})});
   const j=await r.json();if(j.ok){(window.__cmt[key]=window.__cmt[key]||[]).push(j.comment);refresh(key);}else alert('등록 실패: '+(j.error||''));}
  catch(e){alert('네트워크 오류. 잠시 후 다시 시도하세요.');}
  btn.disabled=false;btn.textContent='등록';});}
function renderItem(div){const key=div.dataset.key;
 div.innerHTML='<div class="cmt-h">이 항목 전체에 대한 검토 의견</div>'+listHtml(window.__cmt[key])+formHtml();
 bindForm(div,key,div.dataset.label);}
function renderRow(box,key,label){box.dataset.key=key;box.dataset.label=label;box.innerHTML=listHtml(window.__cmt[key])+formHtml();bindForm(box,key,label);}
async function onActClick(e){
 var b=e.target.closest?e.target.closest('button[data-act]'):null;if(!b)return;
 var cc=b.closest('.cmt-c'),cont=b.closest('.cmt-item,.cmt-rowbox');if(!cont)return;
 var key=cont.dataset.key,id=b.dataset.id,act=b.dataset.act,me=nameNow();
 if(!me){alert('상단에 검토위원 이름을 먼저 입력하세요.');return;}
 if(act==='del'){if(!confirm('이 코멘트를 삭제할까요?'))return;
  try{var r=await fetch(API+'/c/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,reviewer:me})});
   var j=await r.json();if(j.ok){window.__cmt[key]=(window.__cmt[key]||[]).filter(function(c){return String(c.id)!==String(id);});refresh(key);}else alert(j.error||'삭제 실패');}
  catch(_){alert('네트워크 오류');}
 }else if(act==='edit'){if(cc.querySelector('.cmt-edit'))return;
  var cur=(window.__cmt[key]||[]).filter(function(c){return String(c.id)===String(id);})[0];if(!cur)return;
  var bd=cc.querySelector('.bd');bd.style.display='none';
  var ta=document.createElement('textarea');ta.className='cmt-edit';ta.value=cur.body;
  var sv=document.createElement('button');sv.type='button';sv.className='cmt-esave';sv.textContent='저장';
  var cn=document.createElement('button');cn.type='button';cn.className='cmt-ecancel';cn.textContent='취소';
  bd.after(ta,sv,cn);ta.focus();
  cn.onclick=function(){ta.remove();sv.remove();cn.remove();bd.style.display='';};
  sv.onclick=async function(){var nb=ta.value.trim();if(!nb)return;sv.disabled=true;
   try{var r=await fetch(API+'/c/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,reviewer:me,body:nb})});
    var j=await r.json();if(j.ok){var arr=window.__cmt[key]||[];for(var i=0;i<arr.length;i++){if(String(arr[i].id)===String(id))arr[i]=j.comment;}refresh(key);}else{alert(j.error||'수정 실패');sv.disabled=false;}}
   catch(_){alert('네트워크 오류');sv.disabled=false;}};
 }
}
function markBtn(btn){const n=(window.__cmt[btn.dataset.key]||[]).length;btn.classList.toggle('has',n>0);btn.textContent=n?'의견 '+n:'의견';}
function toggleRow(btn){const tr=btn.closest('tr'),key=btn.dataset.key;let w=tr.nextElementSibling;
 if(w&&w.classList.contains('cmt-wrap')){w.remove();return;}
 w=document.createElement('tr');w.className='cmt-wrap';const td=document.createElement('td');td.colSpan=btn.dataset.cols;
 const box=document.createElement('div');box.className='cmt-rowbox';td.appendChild(box);w.appendChild(td);tr.after(w);
 renderRow(box,key,btn.dataset.label);}
function refresh(key){const it=document.querySelector('.cmt-item[data-key="'+CSS.escape(key)+'"]');if(it)renderItem(it);
 document.querySelectorAll('.cmt-btn').forEach(btn=>{if(btn.dataset.key===key){markBtn(btn);
   const w=btn.closest('tr').nextElementSibling;if(w&&w.classList.contains('cmt-wrap'))renderRow(w.querySelector('.cmt-rowbox'),key,btn.dataset.label);}});}
function asgHtml(sp){var arr=window.__asg[sp.dataset.pidx]||[];
 if(arr.length)return arr.map(function(s){return '<span class="pill">'+esc(s)+'</span>';}).join('');
 var def=(sp.dataset.def||'').trim();
 if(def)return '<span class="pill cur">현재: '+esc(def)+'</span>';
 return '<span class="none">지정된 화풍 없음</span>';}
function renderAsg(pidx){document.querySelectorAll('.asg').forEach(function(sp){if(sp.dataset.pidx!==pidx)return;sp.innerHTML=asgHtml(sp);});}
function renderAllAsg(){document.querySelectorAll('.asg').forEach(function(sp){sp.innerHTML=asgHtml(sp);});}
var pkCur=null;
function openPicker(btn){pkCur={pidx:btn.dataset.pidx,artist:btn.dataset.artist};
 var def=(btn.dataset.def||'').trim();var cur=window.__asg[pkCur.pidx];var sel=new Set(cur&&cur.length?cur:(def?[def]:[]));
 document.getElementById('pk-title').textContent=pkCur.artist+' — 화풍 지정';
 document.getElementById('pk-list').innerHTML=STYLES.map(function(s){var c=sel.has(s)?' checked':'';return '<label><input type="checkbox" value="'+esc(s)+'"'+c+'><span>'+esc(s)+'</span></label>';}).join('');
 document.getElementById('pk-search').value='';document.getElementById('pk').classList.add('on');}
function closePicker(){document.getElementById('pk').classList.remove('on');pkCur=null;}
async function savePicker(){if(!pkCur)return;var me=nameNow();if(!me){alert('상단에 검토위원 이름을 먼저 입력하세요.');return;}
 var styles=[].slice.call(document.querySelectorAll('#pk-list input:checked')).map(function(i){return i.value;});
 var sb=document.getElementById('pk-save');sb.disabled=true;sb.textContent='저장중';
 try{var r=await fetch(API+'/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataset:DS,pidx:pkCur.pidx,artist_label:pkCur.artist,styles:styles,reviewer:me})});
  var j=await r.json();if(j.ok){window.__asg[pkCur.pidx]=j.styles;renderAsg(pkCur.pidx);closePicker();}else alert(j.error||'저장 실패');}
 catch(_){alert('네트워크 오류');}sb.disabled=false;sb.textContent='저장';}
async function setup(){
 const nm=document.getElementById('revname');if(nm){nm.value=nameNow();
  document.getElementById('revok').textContent=nameNow()?'\u2713 '+nameNow():'';
  nm.addEventListener('input',()=>{localStorage.setItem('sai_rev_name',nm.value.trim());document.getElementById('revok').textContent=nm.value.trim()?'\u2713 저장됨':'';});}
 window.__cmt={};
 try{const r=await fetch(API+'/c?dataset='+DS);const j=await r.json();
  for(const c of (j.comments||[])){(window.__cmt[c.item_key]=window.__cmt[c.item_key]||[]).push(c);}}catch(e){}
 window.__chk=new Set();
 try{const rc=await fetch(API+'/checks?dataset='+DS);const jc=await rc.json();(jc.checks||[]).forEach(function(c){window.__chk.add(c.item_key);});}catch(e){}
 document.querySelectorAll('.cmt-item').forEach(renderItem);
 document.querySelectorAll('.cmt-btn').forEach(btn=>{markBtn(btn);btn.addEventListener('click',()=>toggleRow(btn));});
 document.querySelectorAll('.chk-btn').forEach(function(b){if(window.__chk.has(b.dataset.key)){b.classList.add('done');b.textContent='검수완료';}b.addEventListener('click',onChkClick);});
 window.__asg={};
 try{const ra=await fetch(API+'/assign?dataset='+DS);const ja=await ra.json();(ja.assigns||[]).forEach(function(a){try{window.__asg[a.pidx]=JSON.parse(a.styles||'[]');}catch(e){window.__asg[a.pidx]=[];}});}catch(e){}
 renderAllAsg();
 document.querySelectorAll('.asg-btn').forEach(function(b){b.addEventListener('click',function(){openPicker(b);});});
 var pkx=document.getElementById('pk-x'),pkc=document.getElementById('pk-cancel'),pks=document.getElementById('pk-save'),pkq=document.getElementById('pk-search'),pko=document.getElementById('pk');
 if(pkx)pkx.onclick=closePicker;if(pkc)pkc.onclick=closePicker;if(pks)pks.onclick=savePicker;
 if(pkq)pkq.addEventListener('input',function(e){var q=e.target.value.trim().toLowerCase();document.querySelectorAll('#pk-list label').forEach(function(l){l.classList.toggle('hid',q&&l.textContent.toLowerCase().indexOf(q)<0);});});
 if(pko)pko.addEventListener('click',function(e){if(e.target.id==='pk')closePicker();});
 document.addEventListener('click',onActClick);}
async function onChkClick(e){
 var b=e.currentTarget,key=b.dataset.key,me=nameNow();
 if(!me){alert('상단에 검토위원 이름을 먼저 입력하세요.');return;}
 var nd=!b.classList.contains('done');b.disabled=true;
 try{var r=await fetch(API+'/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataset:DS,item_key:key,done:nd?1:0,reviewer:me})});
  var j=await r.json();if(j.ok){b.classList.toggle('done',nd);b.textContent=nd?'검수완료':'검수 전';}else alert(j.error||'검수 상태 변경 실패');}
 catch(_){alert('네트워크 오류');}
 b.disabled=false;}
document.getElementById('lockform').addEventListener('submit',async(e)=>{e.preventDefault();
 const err=document.getElementById('err'),go=document.getElementById('go');err.textContent='';go.disabled=true;go.textContent='여는 중\u2026';
 let d;
 try{d=await unlock(document.getElementById('pw').value);}
 catch(_){err.textContent='비밀번호가 올바르지 않습니다.';go.disabled=false;go.textContent='열기';return;}
 const app=document.getElementById('app'),ld=document.getElementById('loader');
 document.getElementById('lock').style.display='none';app.style.display='block';ld.classList.add('on');
 await new Promise(r=>setTimeout(r,40));
 try{app.innerHTML=d.innerHtml;await setup();}
 finally{await new Promise(r=>requestAnimationFrame(function(){r();}));ld.classList.remove('on');}});
</script></body></html>
